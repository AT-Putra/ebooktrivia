name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -s lint
      - name: Typecheck
        run: pnpm -s typecheck
      - name: Unit tests
        run: pnpm -s test
      - name: Core coverage gate (>= 95 % lines)
        run: pnpm --filter @ebooktrivia/core test:coverage
      - name: Crypto coverage gate (>= 95 % lines)
        run: pnpm --filter @ebooktrivia/crypto test:coverage
      - name: Uploads coverage gate (>= 95 % lines)
        run: pnpm --filter @ebooktrivia/uploads test:coverage
      - name: Adapters coverage gate (>= 95 % lines)
        run: pnpm --filter @ebooktrivia/adapters test:coverage
      - name: i18n key parity
        run: pnpm -s check:i18n
      - name: Contrast gate
        run: pnpm -s check:contrast

  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-only # CI ONLY: throwaway service container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_PG_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_API: http://127.0.0.1:8025
      # The dev stack's Valkey ACL (infra/dev/valkey/users.acl), CI ONLY.
      TEST_VALKEY_URL: redis://127.0.0.1:6379
      TEST_VALKEY_USERNAME: worker
      TEST_VALKEY_PASSWORD: worker-devonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not a service container: services start before checkout and cannot mount the ACL files.
      - name: Start Valkey with the dev ACL users
        run: |
          docker run -d --name valkey -p 127.0.0.1:6379:6379 \
            -v "$PWD/infra/dev/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro" \
            -v "$PWD/infra/dev/valkey/users.acl:/usr/local/etc/valkey/users.acl:ro" \
            valkey/valkey:9.1.3 valkey-server /usr/local/etc/valkey/valkey.conf
          for i in $(seq 1 30); do
            docker exec valkey valkey-cli --user ops --pass ops-devonly --no-auth-warning ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs valkey
          exit 1
      # ACL DRYRUN is itself an @admin command that no dev user may run (worker is -@admin, ops is
      # +ping only, default is off), so the ACL is asserted by running the commands as `worker`:
      # FLUSHALL must be refused (on this empty, just-started Valkey a wrong ACL flushes nothing)
      # and INFO, which BullMQ / ioredis need on connect, must be answered.
      - name: Assert the worker ACL (no FLUSHALL, INFO allowed)
        run: |
          cli() { docker exec valkey valkey-cli --user worker --pass worker-devonly --no-auth-warning "$@" 2>&1; }
          cli FLUSHALL | grep -q "NOPERM" || { echo "worker may run FLUSHALL"; exit 1; }
          cli INFO server | grep -q "^valkey_version:" || { echo "worker may not run INFO"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrations, roles, denial tests (fresh database, applied twice)
        run: pnpm --filter @ebooktrivia/db test:int
      - name: Secret resolver end to end (fresh database)
        run: pnpm --filter @ebooktrivia/crypto test:int
      - name: SMTP adapter round trip (Mailpit)
        run: pnpm --filter @ebooktrivia/adapters test:int
      - name: Admin auth, lockout, sessions, audit, CLI (fresh database)
        run: pnpm --filter @ebooktrivia/admin test:int
      # US-020: checkout and Cap routes as public_rw, Valkey user `public`, midtrans-stub in-process.
      - name: Checkout API, dedupe, Snap and MO (fresh database)
        run: pnpm --filter @ebooktrivia/public test:int
        env:
          TEST_VALKEY_PUBLIC_USERNAME: public
          TEST_VALKEY_PUBLIC_PASSWORD: public-devonly
      # US-032: the load-test seed, its cleanup and the AC-P8 verifier against the real schema.
      - name: Load-test seed, cleanup and AC-P8 verifier (fresh database)
        run: pnpm --filter @ebooktrivia/load test:int
      # Here, not in verify: the worker is mostly I/O, so its gate counts the integration tests.
      - name: Worker coverage gate (>= 95 % lines; unit + in-process integration)
        run: pnpm --filter @ebooktrivia/worker test:coverage
      # The rest of test:int (the coverage step already ran the other integration files).
      - name: Worker chaos and load tests, production Valkey ACL (real processes, Docker)
        run: pnpm --filter @ebooktrivia/worker test:chaos

  # US-015: migration compatibility. A rolling deploy migrates first and restarts the apps after, and a failed deploy rolls the
  # images back and leaves the schema alone, so the PREVIOUS release must run on the NEW schema. This job exports the previous
  # release (the pull request's base, or the commit before the push), gives it this checkout's migrations, SQL files and runner,
  # and runs ITS integration tests (public, admin, worker, crypto) on it; it also refuses a migration that contracts the schema
  # (drops, renames, retypes, NOT NULL without a default) unless it says why (infra/verify/src/expand-only.ts). Locally:
  # infra/verify/local/migration-compat.sh [PREVIOUS_REF].
  migration-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-only # CI ONLY: throwaway service container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_PG_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_API: http://127.0.0.1:8025
      TEST_VALKEY_URL: redis://127.0.0.1:6379
      TEST_VALKEY_USERNAME: worker
      TEST_VALKEY_PASSWORD: worker-devonly
      TEST_VALKEY_PUBLIC_USERNAME: public
      TEST_VALKEY_PUBLIC_PASSWORD: public-devonly
    steps:
      # The whole history: the previous release is a commit of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start Valkey with the dev ACL users
        run: |
          docker run -d --name valkey -p 127.0.0.1:6379:6379 \
            -v "$PWD/infra/dev/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro" \
            -v "$PWD/infra/dev/valkey/users.acl:/usr/local/etc/valkey/users.acl:ro" \
            valkey/valkey:9.1.3 valkey-server /usr/local/etc/valkey/valkey.conf
          for i in $(seq 1 30); do
            docker exec valkey valkey-cli --user ops --pass ops-devonly --no-auth-warning ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs valkey
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: The previous release's tests on the new schema (and the expand-only rule)
        env:
          PREVIOUS_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch's first push has no "before" (all zeros): the script then takes the merge-base / HEAD~1.
          if [[ "$PREVIOUS_REF" =~ ^0+$ ]]; then PREVIOUS_REF=""; fi
          bash infra/verify/local/migration-compat.sh "$PREVIOUS_REF"

  # Static checks of the VM infrastructure (US-014). The provisioning itself and the full stack run
  # locally in infra/verify/local/{vm-sim,stack-sim}.sh (privileged systemd container, nested
  # rootless podman) and on the staging VM (docs/runbooks/staging-provision.md).
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck (every infra script)
        run: bash infra/verify/local/shellcheck.sh
      - name: Caddyfile validate, caddy fmt, adapted JSON up to date (Caddy 2.11.9)
        run: bash infra/verify/local/caddy-adapt.sh --check
      - name: SDK route headers in a real Caddy 2.11.9 (immutable versions, 5 minute alias, no cached 404)
        run: bash infra/verify/local/sdk-headers.sh
      - name: Order site headers and access-log redaction in a real Caddy 2.11.9 (one Referrer-Policy, no cookies, no public id in logs)
        run: bash infra/verify/local/order-headers.sh
      - name: LP site in a real Caddy 2.11.9 (fixed types, CSP, refusals, atomic symlink swaps; US-023)
        run: bash infra/verify/local/lp-headers.sh
      - name: Deep /healthz routing in a real Caddy 2.11.9 (the monitor's address only; a 404 for everyone else and on play / order; US-015)
        run: bash infra/verify/local/healthz-routing.sh
      - name: wal-g point-in-time recovery with libsodium-encrypted WAL after a killed server, and the restic copy, on the real images (FILE backends; US-015)
        run: bash infra/verify/local/backup-pitr.sh
      - name: Quadlet generator dry run (AlmaLinux 10.2, podman 5.8)
        run: bash infra/verify/local/quadlet-dryrun.sh

  # The production server entry (Next.js behind packages/edge) on a real build: /livez, the page,
  # the listener on the configured address (US-014 review C-L2).
  edge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build public and admin
        # The admin build bakes its origin into the server-action allowedOrigins (next.config.ts);
        # the smoke test serves plain http on loopback.
        env:
          ADMIN_ORIGIN: http://127.0.0.1:3990
          ADMIN_ALLOW_INSECURE_LOOPBACK: "1"
        run: pnpm --filter @ebooktrivia/public run build && pnpm --filter @ebooktrivia/admin run build
      - name: Smoke-test node apps/<app>/src/server.ts
        run: bash infra/verify/local/edge-smoke.sh public && bash infra/verify/local/edge-smoke.sh admin
      # US-031: the full security header set per host (admin, play, order, api, SDK, LP) from the real Caddyfile in
      # Caddy 2.11.9 in front of these builds, against one policy (infra/verify/src/security-headers.ts).
      - name: Security headers per host (real Caddy in front of the real builds)
        run: bash infra/verify/local/security-headers.sh

  # Playwright on production builds (US-016 review): the mockups and their 404 guard, and the admin
  # console's auth flows (forced 2FA, recovery codes, Staff 403, cross-origin POSTs, lockout, CSP)
  # against a throwaway migrated database. The admin-auth spec starts its own `next start`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-only # CI ONLY: throwaway service container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_PG_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the Playwright browser
        run: pnpm --filter @ebooktrivia/e2e exec playwright install --with-deps chromium chromium-headless-shell
      - name: Playwright (mockups, 404 guard, admin auth, settings and trivia, landing-page SDK)
        run: pnpm --filter @ebooktrivia/e2e exec playwright test

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The same gitleaks release and config (.gitleaks.toml, found at the repository root) as the local scan
      # infra/verify/local/security-scan.sh (US-031); the action's own default would be 8.24.3.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # OSV-Scanner 2.7.0, like infra/verify/local/security-scan.sh; both read osv-scanner.toml next to the lockfile.
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
