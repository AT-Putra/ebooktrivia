# public@a: pinned addresses (pg_hba.conf allows ebt_public from 10.89.51.11 only), the edge
# address it listens on, and its health check on that address (bash: the image has no curl).
[Container]
Network=ebt-edge.network:ip=10.89.50.11
Network=ebt-data.network:ip=10.89.51.11
Environment=EDGE_HOST=10.89.50.11
HealthCmd=bash -c 'exec 3<>/dev/tcp/10.89.50.11/3000 && printf "GET /livez HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
