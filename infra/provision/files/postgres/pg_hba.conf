# Managed by infra/provision (installed as /etc/ebooktrivia/postgres/pg_hba.conf, mounted into the
# postgres container). First match wins. Each app login reaches the ebooktrivia database only,
# from its own pinned address on the data network (infra/quadlet). The superuser is local-socket
# only (podman exec -u postgres). Everything else is rejected.
# TYPE  DATABASE     USER          ADDRESS          METHOD
local   all          postgres                       peer
host    ebooktrivia  ebt_public    10.89.51.11/32   scram-sha-256
host    ebooktrivia  ebt_public    10.89.51.12/32   scram-sha-256
host    ebooktrivia  ebt_admin     10.89.51.13/32   scram-sha-256
host    ebooktrivia  ebt_worker    10.89.51.14/32   scram-sha-256
host    ebooktrivia  ebt_internal  10.89.51.15/32   scram-sha-256
host    ebooktrivia  ebt_migrate   10.89.51.16/32   scram-sha-256
local   all          all                            reject
host    all          all           all              reject
