# Managed by infra/provision (installed as /etc/ssh/sshd_config.d/00-ebooktrivia.conf). sshd keeps
# the FIRST value it reads for a keyword, and this drop-in sorts before every other one, so these
# settings win; provision.sh refuses other drop-ins that could weaken them. Key-only, no root
# login, no forwarding, and only ADMIN_SSH_USER from SSH_ALLOWED_CIDRS (@ALLOW_USERS@ is rendered
# as one user@cidr entry per CIDR).
AllowUsers @ALLOW_USERS@
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
GSSAPIAuthentication no
DisableForwarding yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
