# Managed by infra/provision (installed as /etc/sysctl.d/90-ebooktrivia.conf).
# The app user's systemd binds Caddy's :80/:443 (caddy.socket) without root.
net.ipv4.ip_unprivileged_port_start = 80
# Valkey's AOF rewrite forks; without overcommit the fork can fail under memory pressure.
vm.overcommit_memory = 1
# No faking keyboard input on a terminal (TIOCSTI): a process of the app user could otherwise type
# into a root shell whose terminal it inherited.
dev.tty.legacy_tiocsti = 0
