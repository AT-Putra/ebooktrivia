# Managed by infra/provision (installed as /etc/dnf/automatic.conf; the package marks it
# %config(noreplace), so updates keep this copy). dnf-automatic.timer applies security updates
# only. Reboots are left to the operator (`dnf needs-restarting -r`, see the staging runbook).
[commands]
upgrade_type = security
random_sleep = 0
network_online_timeout = 60
download_updates = yes
apply_updates = yes
reboot = never

[emitters]
emit_via = stdio

[email]
email_from = root@localhost
email_to = root
email_host = localhost

[command]

[command_email]

[base]
debuglevel = 1
