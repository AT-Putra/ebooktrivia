# Managed by infra/provision (installed as /etc/ebooktrivia/valkey/valkey.conf). Production Valkey
# (plan M4.1): ACL users only, the default user is off; noeviction; AOF.
bind 0.0.0.0
port 6379
protected-mode yes
dir /data
aclfile /etc/valkey/users.acl
# 512 MB container budget; headroom for the AOF rewrite fork and buffers.
maxmemory 384mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save ""
