# ZAP 2.17.0 Automation Framework plan (US-031): the authenticated scan of admin.<domain> as the staging test Owner.
# Run by infra/verify/staging/zap-auth.sh, which passes the ${...} values as environment variables (never written to
# disk). Browser-based login in the image's headless Firefox: e-mail and password, then the TOTP code of the second
# step (lib/auth: forced 2FA), generated by ZAP from ZAP_ADMIN_TOTP_SECRET. The spider never posts forms: every
# console change is a POST server action (and needs the exact Origin, lib/http-security.ts), so the scan only reads;
# signing out and the upload endpoints are out of scope. docs/runbooks/security-scans.md has the steps.
env:
  contexts:
    - name: admin
      urls:
        - "https://admin.${ZAP_DOMAIN}/"
      includePaths:
        - "https://admin\\.${ZAP_DOMAIN_REGEX}/.*"
      excludePaths:
        - "https://admin\\.${ZAP_DOMAIN_REGEX}/auth/sign-out.*"
        - "https://admin\\.${ZAP_DOMAIN_REGEX}/uploads/.*"
        - "https://admin\\.${ZAP_DOMAIN_REGEX}/login.*"
        - "https://admin\\.${ZAP_DOMAIN_REGEX}/enroll.*"
      authentication:
        method: browser
        parameters:
          loginPageUrl: "https://admin.${ZAP_DOMAIN}/login"
          loginPageWait: 5
          browserId: firefox-headless
          steps:
            - description: e-mail
              type: USERNAME
              cssSelector: "#email"
            - description: password
              type: PASSWORD
              cssSelector: "#password"
            - description: submit the first step
              type: RETURN
              cssSelector: "#password"
            - description: wait for the second-factor page
              type: WAIT
              timeout: 5000
            - description: the TOTP code
              type: TOTP_FIELD
              cssSelector: "#code"
            - description: submit the code
              type: RETURN
              cssSelector: "#code"
        verification:
          # Signed in, every console page links to the sign-out route; signed out, /account answers the login form.
          method: poll
          pollUrl: "https://admin.${ZAP_DOMAIN}/account"
          pollFrequency: 30
          pollUnits: requests
          loggedInRegex: "/auth/sign-out"
          loggedOutRegex: "name=\"password\""
      sessionManagement:
        method: autodetect
      users:
        - name: owner
          credentials:
            username: "${ZAP_ADMIN_EMAIL}"
            password: "${ZAP_ADMIN_PASSWORD}"
            totp:
              secret: "${ZAP_ADMIN_TOTP_SECRET}"
              period: 30
              digits: 6
              algorithm: SHA1
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true
    # Off (security review M1): these informational rules copy the login request, the session token and the
    # login check into the report as evidence, which would put the test account's credentials and session in it.
    rules:
      - id: 10111
        name: Authentication Request Identified
        threshold: "off"
      - id: 10112
        name: Session Management Response Identified
        threshold: "off"
      - id: 10113
        name: Verification Request Identified
        threshold: "off"
  - type: spider
    parameters:
      context: admin
      user: owner
      url: "https://admin.${ZAP_DOMAIN}/"
      maxDuration: 10
      maxDepth: 6
      postForm: false
  - type: passiveScan-wait
    parameters:
      maxDuration: 10
  # ACTIVE_SCAN (zap-auth.sh --active inserts the activeScan job here)
  # The URLs the scan reached: zap-auth.sh fails the scan unless one is a signed-in-only page (security review M2,
  # infra/verify/src/zap-report.ts signedInUrls). URLs only, no request or response content.
  - type: export
    parameters:
      context: admin
      type: url
      source: sitestree
      fileName: /zap/wrk/admin-urls.txt
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: admin-auth.json
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: admin-auth.html
