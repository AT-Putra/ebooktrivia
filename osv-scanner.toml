# OSV-Scanner 2.7.0 configuration (US-031), found next to pnpm-lock.yaml by CI (google/osv-scanner-action) and by
# infra/verify/local/security-scan.sh. Each entry is a reviewed finding that is not reachable here, pinned to the exact
